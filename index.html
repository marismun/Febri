<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Untukmu — Love Story</title>

  <!-- Pratinjau Tautan saat dibagikan (WhatsApp, Instagram, dll.) -->
  <meta property="og:title" content="Untukmu — Sebuah Kejutan Kecil ✨" />
  <meta property="og:description" content="Buka tautan ini, nyalakan suaramu, dan lihat bunga-bunga bermekaran." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts untuk tipografi romantis -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-top: #160922;
      --bg-mid-1: #341345;
      --bg-mid-2: #6b2158;
      --bg-bottom: #b94b70;
      --text-main: #fff5f8;
      --text-muted: rgba(255, 224, 235, 0.52);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      background: linear-gradient(175deg, var(--bg-top) 0%, var(--bg-mid-1) 36%, var(--bg-mid-2) 72%, var(--bg-bottom) 100%);
      user-select: none;
    }

    /* Cahaya ambient lembut di latar belakang */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 36%, rgba(255, 160, 195, 0.2) 0%, transparent 56%),
        radial-gradient(circle at 20% 82%, rgba(255, 196, 140, 0.16) 0%, transparent 48%),
        radial-gradient(circle at 82% 78%, rgba(216, 112, 168, 0.2) 0%, transparent 52%);
      z-index: 1;
    }

    /* Canvas utama untuk partikel, kelopak, dan taman bunga mekar */
    #gardenCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      cursor: pointer;
    }

    /* 3 Tombol Tap Acak (muncul 300ms, jeda 1 detik) */
    .random-tap-btn {
      position: fixed;
      z-index: 25;
      display: none;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      padding: 9px 20px;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 224, 236, 0.85);
      background: radial-gradient(circle at 30% 30%, rgba(255, 182, 206, 0.92), rgba(225, 75, 130, 0.88));
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow:
        0 0 18px rgba(255, 143, 177, 0.85),
        0 0 34px rgba(255, 214, 165, 0.55);
      cursor: pointer;
      animation: tapPop 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .random-tap-btn.visible {
      display: flex;
    }

    .random-tap-btn:active {
      transform: translate(-50%, -50%) scale(0.9);
    }

    @keyframes tapPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.65);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* Area Lirik Karaoke di Tengah Atas-Tengah Layar */
    .lyrics-stage {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 140px;
      pointer-events: none;
      text-align: center;
    }

    .lyrics-box {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .lyric-line {
      font-family: 'Cormorant Garamond', Georgia, serif;
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.65s ease;
      will-change: transform, opacity;
    }

    .lyric-prev,
    .lyric-next {
      font-size: clamp(1.08rem, 2.3vw, 1.5rem);
      font-style: italic;
      color: var(--text-muted);
      opacity: 0.55;
      transform: scale(0.95);
    }

    .lyric-active {
      font-size: clamp(1.75rem, 4.4vw, 3rem);
      font-weight: 600;
      line-height: 1.32;
      color: #ffffff;
      text-shadow:
        0 0 18px rgba(255, 158, 190, 0.9),
        0 0 38px rgba(255, 112, 166, 0.6),
        0 2px 12px rgba(20, 6, 30, 0.65);
      animation: lyricFocusIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes lyricFocusIn {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.94);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1.03);
        filter: blur(0);
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Canvas untuk Partikel Cahaya, Kelopak, & Taman Bunga Mekar 15 Detik -->
  <canvas id="gardenCanvas"></canvas>

  <!-- 3 Tombol Tap Acak (muncul 300ms, jeda 1000ms) -->
  <button class="random-tap-btn" id="tapBtn0" type="button">Tap ✨</button>
  <button class="random-tap-btn" id="tapBtn1" type="button">Tap ✨</button>
  <button class="random-tap-btn" id="tapBtn2" type="button">Tap ✨</button>

  <!-- Tampilan Lirik Sinkron -->
  <main class="lyrics-stage" aria-live="polite">
    <div class="lyrics-box">
      <div class="lyric-line lyric-prev" id="lyricPrev"></div>
      <div class="lyric-line lyric-active" id="lyricActive">♪ Love Story — Taylor Swift ♪</div>
      <div class="lyric-line lyric-next" id="lyricNext"></div>
    </div>
  </main>

  <!-- Elemen Audio Tersembunyi (Autoplay saat halaman dibuka) -->
  <audio id="audioPlayer" src="love-story.mp3" preload="auto" autoplay></audio>

  <script>
    /* =========================================================================
       1. DATA LIRIK BERBASIS TIMESTAMP (DETIK)
       Disesuaikan untuk "Love Story (Taylor's Version)" (durasi 4:00).
       Lengkapi baris lirik pada tiap slot waktu sesuai file audio Anda:
       ========================================================================= */
    const lyrics = [
      { time: 0.0,   text: "♪ Love Story (Taylor's Version) — Taylor Swift ♪" },

      // Verse 1 (00:15)
      { time: 15.5,  text: "We were both young when I first saw you" },
      { time: 19.5,  text: "I close my eyes and the flashback starts" },
      { time: 23.0,  text: "I'm standin' there" },
      { time: 25.5,  text: "On a balcony in summer air" },
      { time: 31.0,  text: "♪ Verse 1 — Lanjutkan baris 0:31 hingga 0:46 ♪" },

      // Pre-Chorus 1 (00:47)
      { time: 47.0,  text: "♪ Pre-Chorus 1 — 0:47 hingga 1:03 ♪" },

      // Chorus 1 (01:04)
      { time: 64.0,  text: "♪ Chorus 1 — 1:04 hingga 1:21 ♪" },

      // Verse 2 (01:22)
      { time: 82.5,  text: "♪ Verse 2 — 1:22 hingga 1:39 ♪" },

      // Pre-Chorus 2 (01:40)
      { time: 100.0, text: "♪ Pre-Chorus 2 — 1:40 hingga 1:55 ♪" },

      // Chorus 2 (01:56)
      { time: 116.0, text: "♪ Chorus 2 — 1:56 hingga 2:29 ♪" },

      // Instrumental Interlude (02:30)
      { time: 150.0, text: "♪ ♪ ♪" },

      // Bridge (02:44)
      { time: 164.0, text: "♪ Bridge — 2:44 hingga 3:16 ♪" },

      // Final Chorus (03:17)
      { time: 197.0, text: "♪ Final Chorus — 3:17 hingga 3:44 ♪" },

      // Outro (03:45)
      { time: 225.0, text: "♪ Outro — 3:45 hingga selesai ♪" }
    ];

    /* =========================================================================
       2. AUTO-PLAY AUDIO & SINKRONISASI LIRIK KARAOKE TANPA UI PEMUTAR
       ========================================================================= */
    const audio = document.getElementById("audioPlayer");
    const lyricPrevEl = document.getElementById("lyricPrev");
    const lyricActiveEl = document.getElementById("lyricActive");
    const lyricNextEl = document.getElementById("lyricNext");

    let currentLyricIndex = -1;
    audio.volume = 0.9;

    function ensureAudioPlaying() {
      if (audio.paused) {
        audio.play().catch(() => {
          // Jika kebijakan browser menunda autoplay sebelum interaksi pertama,
          // audio akan otomatis berjalan saat pengguna menekan tombol Tap atau layar.
        });
      }
    }

    // Coba langsung putar saat DOM siap dan saat halaman selesai dimuat
    document.addEventListener("DOMContentLoaded", ensureAudioPlaying);
    window.addEventListener("load", ensureAudioPlaying);

    // Cadangan interaksi pertama agar audio langsung menyala bila autoplay sempat tertahan browser
    ["pointerdown", "touchstart", "click", "keydown"].forEach((evt) => {
      window.addEventListener(evt, ensureAudioPlaying, { once: true, passive: true });
    });

    function syncLyrics(currentTime) {
      let activeIdx = 0;
      for (let i = 0; i < lyrics.length; i++) {
        if (currentTime >= lyrics[i].time) {
          activeIdx = i;
        } else {
          break;
        }
      }

      if (activeIdx !== currentLyricIndex) {
        currentLyricIndex = activeIdx;

        lyricPrevEl.textContent = activeIdx > 0 ? lyrics[activeIdx - 1].text : "";
        lyricNextEl.textContent = activeIdx < lyrics.length - 1 ? lyrics[activeIdx + 1].text : "";

        lyricActiveEl.style.animation = "none";
        void lyricActiveEl.offsetWidth;
        lyricActiveEl.textContent = lyrics[activeIdx].text;
        lyricActiveEl.style.animation = "";
      }
    }

    audio.addEventListener("timeupdate", () => {
      syncLyrics(audio.currentTime);
    });

    /* =========================================================================
       3. ENGINE ANIMASI 60FPS: BUNGA BERTANGKAI MEKAR 15 DETIK (AWAL -> AKHIR)
       ========================================================================= */
    const canvas = document.getElementById("gardenCanvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = 1;

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeInOutSine(t) {
      return -(Math.cos(Math.PI * t) - 1) / 2;
    }

    function easeOutBack(t) {
      const c1 = 1.45;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    // --- Partikel Cahaya Hangat ---
    const particles = [];
    const PARTICLE_COUNT = Math.min(60, Math.floor((width * height) / 16000));

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: 1.2 + Math.random() * 2.8,
        vy: -0.18 - Math.random() * 0.35,
        vx: (Math.random() - 0.5) * 0.25,
        phase: Math.random() * Math.PI * 2,
        hue: Math.random() > 0.45 ? "255, 214, 165" : "255, 165, 200"
      });
    }

    // --- Kelopak Bunga Melayang ---
    const petals = [];
    const PETAL_COUNT = Math.min(36, Math.floor(width / 30));

    function createPetal(randomY = false) {
      const colors = ["#ffb3c6", "#ff8fab", "#ffc2d1", "#ffe5ec", "#f49cbb"];
      return {
        x: Math.random() * width,
        y: randomY ? Math.random() * height : -20 - Math.random() * 80,
        size: 6 + Math.random() * 7,
        vy: 0.45 + Math.random() * 0.75,
        swayAmp: 0.6 + Math.random() * 1.1,
        swayFreq: 0.012 + Math.random() * 0.015,
        angle: Math.random() * Math.PI * 2,
        vAngle: (Math.random() - 0.5) * 0.03,
        phase: Math.random() * Math.PI * 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 0.45 + Math.random() * 0.4
      };
    }

    for (let i = 0; i < PETAL_COUNT; i++) {
      petals.push(createPetal(true));
    }

    // --- Riak Cahaya saat Tombol Tap / Layar Diklik ---
    const ripples = [];

    // --- Koleksi Bunga Mekar Bertangkai ---
    const flowers = [];
    const MAX_FLOWERS = 65;
    const FLOWER_TYPES = ["rose", "sakura", "tulip"];

    class BloomingFlower {
      constructor({
        x,
        y,
        stemHeight,
        type,
        scale = 1,
        delay = 0,
        stemDuration = 2.4,
        bloomDuration = 2.8,
        isUserSpawned = false
      }) {
        this.targetX = x;
        this.targetY = y;
        this.stemHeight = Math.max(45, stemHeight);
        this.baseX = x + (Math.random() - 0.5) * 34;
        this.baseY = y + this.stemHeight;
        this.ctrlX = (this.baseX + x) / 2 + (Math.random() - 0.5) * 44;
        this.ctrlY = (this.baseY + y) / 2;

        this.type = type;
        this.maxScale = scale;
        this.delay = delay;
        this.stemDuration = stemDuration;
        this.bloomDuration = bloomDuration;
        this.isUserSpawned = isUserSpawned;

        this.age = 0;
        this.swayPhase = Math.random() * Math.PI * 2;
        this.rotation = (Math.random() - 0.5) * 0.32;
        this.alpha = 1;
        this.fadingOut = false;
        this.currentSway = 0;

        if (type === "rose") {
          const palettes = [
            { outer: "#be123c", mid: "#e11d48", inner: "#fb7185", core: "#ffe4e6" },
            { outer: "#9d174d", mid: "#db2777", inner: "#f472b6", core: "#fce7f3" },
            { outer: "#e11d48", mid: "#fb7185", inner: "#fda4af", core: "#fff1f2" }
          ];
          this.palette = palettes[Math.floor(Math.random() * palettes.length)];
        } else if (type === "sakura") {
          const palettes = [
            { petal: "#fbcfe8", tip: "#fff1f2", center: "#be185d", stamen: "#fde047" },
            { petal: "#f9a8d4", tip: "#fce7f3", center: "#9d174d", stamen: "#fef08a" }
          ];
          this.palette = palettes[Math.floor(Math.random() * palettes.length)];
        } else {
          const palettes = [
            { left: "#e11d48", right: "#fb7185", center: "#fda4af" },
            { left: "#db2777", right: "#f472b6", center: "#fbcfe8" },
            { left: "#c026d3", right: "#e879f9", center: "#fae8ff" }
          ];
          this.palette = palettes[Math.floor(Math.random() * palettes.length)];
        }
      }

      update(dt, time) {
        if (this.delay > 0) {
          this.delay -= dt;
          return;
        }
        this.age += dt;
        if (this.fadingOut) {
          this.alpha -= dt * 0.55;
        }
        this.currentSway = Math.sin(time * 1.35 + this.swayPhase) * 5.0 * this.maxScale;
      }

      // Titik pada kurva Bezier kuadratik tangkai (t dari 0 ke 1)
      getStemPoint(t, swayOffset) {
        const inv = 1 - t;
        const p0x = this.baseX;
        const p0y = this.baseY;
        const p1x = this.ctrlX + swayOffset * 0.5;
        const p1y = this.ctrlY;
        const p2x = this.targetX + swayOffset;
        const p2y = this.targetY;

        return {
          x: inv * inv * p0x + 2 * inv * t * p1x + t * t * p2x,
          y: inv * inv * p0y + 2 * inv * t * p1y + t * t * p2y
        };
      }

      draw(ctx) {
        if (this.delay > 0 || this.alpha <= 0) return;

        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);

        // 1. Progres pertumbuhan tangkai (0 -> 1)
        const stemRaw = Math.min(1, this.age / this.stemDuration);
        const easedStem = easeInOutSine(stemRaw);

        // 2. Progres mekarnya bunga mulai dari kuncup kecil (saat tangkai 55%) hingga mekar penuh
        const bloomStart = this.stemDuration * 0.55;
        const bloomRaw = Math.max(0, (this.age - bloomStart) / this.bloomDuration);
        const bloomProgress = Math.min(1, bloomRaw);
        const easedBloom = easeOutBack(bloomProgress);

        const sway = this.currentSway * easedStem;
        const tip = this.getStemPoint(easedStem, sway);

        // Gambar Tangkai Bertahap
        if (easedStem > 0.01) {
          const stemGrad = ctx.createLinearGradient(this.baseX, this.baseY, tip.x, tip.y);
          stemGrad.addColorStop(0, "#123824");
          stemGrad.addColorStop(0.55, "#245c43");
          stemGrad.addColorStop(1, "#40916c");

          ctx.strokeStyle = stemGrad;
          ctx.lineWidth = (2.2 + 0.8 * easedStem) * this.maxScale;
          ctx.lineCap = "round";

          ctx.beginPath();
          const steps = 18;
          for (let s = 0; s <= steps; s++) {
            const t = (s / steps) * easedStem;
            const pt = this.getStemPoint(t, sway);
            if (s === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();

          // Daun pertama tumbuh saat tangkai melewati 35%
          if (easedStem > 0.35) {
            const leaf1Prog = Math.min(1, (easedStem - 0.35) / 0.35);
            const leaf1Pos = this.getStemPoint(0.35, sway);
            this.drawLeaf(ctx, leaf1Pos.x, leaf1Pos.y, -0.68, easeOutCubic(leaf1Prog) * this.maxScale);
          }

          // Daun kedua tumbuh saat tangkai melewati 62%
          if (easedStem > 0.62 && this.stemHeight > 85) {
            const leaf2Prog = Math.min(1, (easedStem - 0.62) / 0.35);
            const leaf2Pos = this.getStemPoint(0.62, sway);
            this.drawLeaf(ctx, leaf2Pos.x, leaf2Pos.y, 0.68, easeOutCubic(leaf2Prog) * this.maxScale * 0.9);
          }

          // Daun ketiga untuk tangkai yang tinggi
          if (easedStem > 0.8 && this.stemHeight > 185) {
            const leaf3Prog = Math.min(1, (easedStem - 0.8) / 0.2);
            const leaf3Pos = this.getStemPoint(0.8, sway);
            this.drawLeaf(ctx, leaf3Pos.x, leaf3Pos.y, -0.58, easeOutCubic(leaf3Prog) * this.maxScale * 0.78);
          }
        }

        // Gambar Kuncup hingga Kelopak Mekar Penuh di Ujung Tangkai
        if (bloomProgress > 0) {
          ctx.translate(tip.x, tip.y);
          ctx.rotate(this.rotation + sway * 0.015);
          // Mulai dari kuncup kecil (0.18) lalu membesar & mekar penuh (1.0)
          const budToFullScale = (0.18 + 0.82 * Math.max(0, easedBloom)) * this.maxScale;
          ctx.scale(budToFullScale, budToFullScale);

          if (this.type === "rose") {
            this.drawRose(ctx, bloomProgress);
          } else if (this.type === "sakura") {
            this.drawSakura(ctx, bloomProgress);
          } else {
            this.drawTulip(ctx, bloomProgress);
          }
        }

        ctx.restore();
      }

      drawLeaf(ctx, x, y, angle, scale) {
        if (scale <= 0.01) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.scale(scale, scale);

        ctx.fillStyle = "#2d6a4f";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(14, -10, 28, 0);
        ctx.quadraticCurveTo(14, 10, 0, 0);
        ctx.fill();

        ctx.strokeStyle = "#52b788";
        ctx.lineWidth = 0.85;
        ctx.beginPath();
        ctx.moveTo(2, 0);
        ctx.lineTo(23, 0);
        ctx.stroke();

        ctx.restore();
      }

      drawRose(ctx, progress) {
        const layers = [
          { count: 6, radius: 22, color: this.palette.outer, rotOffset: 0 },
          { count: 5, radius: 16, color: this.palette.mid, rotOffset: 0.5 },
          { count: 4, radius: 10.5, color: this.palette.inner, rotOffset: 1.0 },
          { count: 3, radius: 5.5, color: this.palette.core, rotOffset: 1.6 }
        ];

        layers.forEach((layer, idx) => {
          const layerOpen = Math.min(1, Math.max(0.15, progress * (1.3 - idx * 0.14)));
          for (let i = 0; i < layer.count; i++) {
            ctx.save();
            const theta = (i / layer.count) * Math.PI * 2 + layer.rotOffset;
            ctx.rotate(theta);
            const r = layer.radius * (0.35 + 0.65 * layerOpen);

            ctx.fillStyle = layer.color;
            ctx.shadowColor = "rgba(25, 4, 18, 0.35)";
            ctx.shadowBlur = 4;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-r * 0.85, -r * 0.4, -r * 0.9, -r * 1.35, 0, -r * 1.45);
            ctx.bezierCurveTo(r * 0.9, -r * 1.35, r * 0.85, -r * 0.4, 0, 0);
            ctx.fill();
            ctx.restore();
          }
        });
      }

      drawSakura(ctx, progress) {
        const petalCount = 5;
        const r = 24 * (0.3 + 0.7 * progress);

        for (let i = 0; i < petalCount; i++) {
          ctx.save();
          ctx.rotate((i / petalCount) * Math.PI * 2);

          const grad = ctx.createLinearGradient(0, 0, 0, -r * 1.4);
          grad.addColorStop(0, this.palette.center);
          grad.addColorStop(0.35, this.palette.petal);
          grad.addColorStop(1, this.palette.tip);

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-r * 0.65, -r * 0.45, -r * 0.65, -r * 1.2, -r * 0.14, -r * 1.38);
          ctx.lineTo(0, -r * 1.2);
          ctx.lineTo(r * 0.14, -r * 1.38);
          ctx.bezierCurveTo(r * 0.65, -r * 1.2, r * 0.65, -r * 0.45, 0, 0);
          ctx.fill();
          ctx.restore();
        }

        ctx.fillStyle = this.palette.center;
        ctx.beginPath();
        ctx.arc(0, 0, 4.2, 0, Math.PI * 2);
        ctx.fill();

        for (let s = 0; s < 8; s++) {
          const ang = (s / 8) * Math.PI * 2;
          const len = 8.5 * progress;
          ctx.strokeStyle = this.palette.stamen;
          ctx.lineWidth = 0.9;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ang) * len, Math.sin(ang) * len);
          ctx.stroke();

          ctx.fillStyle = this.palette.stamen;
          ctx.beginPath();
          ctx.arc(Math.cos(ang) * len, Math.sin(ang) * len, 1.3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawTulip(ctx, progress) {
        const openSpread = 0.15 + 0.85 * progress;
        const h = 34;
        const w = 15;

        ctx.fillStyle = this.palette.center;
        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.bezierCurveTo(-w * 0.9, -h * 0.4, -w * 0.6, -h * 1.05, 0, -h * 1.12);
        ctx.bezierCurveTo(w * 0.6, -h * 1.05, w * 0.9, -h * 0.4, 0, 4);
        ctx.fill();

        ctx.save();
        ctx.rotate(-0.24 * openSpread);
        ctx.fillStyle = this.palette.left;
        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.bezierCurveTo(-w * 1.25, -h * 0.2, -w * 1.1, -h * 0.95, -w * 0.15, -h * 1.04);
        ctx.bezierCurveTo(w * 0.35, -h * 0.7, w * 0.3, -h * 0.2, 0, 4);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.rotate(0.24 * openSpread);
        ctx.fillStyle = this.palette.right;
        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.bezierCurveTo(w * 1.25, -h * 0.2, w * 1.1, -h * 0.95, w * 0.15, -h * 1.04);
        ctx.bezierCurveTo(-w * 0.35, -h * 0.7, -w * 0.3, -h * 0.2, 0, 4);
        ctx.fill();
        ctx.restore();
      }
    }

    function addFlower(config) {
      if (flowers.length >= MAX_FLOWERS) {
        const oldestUserFlower = flowers.find(f => f.isUserSpawned && !f.fadingOut);
        if (oldestUserFlower) {
          oldestUserFlower.fadingOut = true;
        }
      }
      flowers.push(new BloomingFlower(config));
    }

    /* =========================================================================
       4. RANGKAIAN BANYAK BUNGA BERTANGKAI MEKAR SELAMA 15 DETIK (0s -> 15s)
       ========================================================================= */
    function spawnFifteenSecondGarden() {
      flowers.length = 0;

      // Total waktu dari bunga pertama mulai tumbuh hingga bunga terakhir mekar penuh = 15 detik
      const TOTAL_SEQUENCE_SECONDS = 15.0;
      const STEM_GROW_TIME = 2.4;
      const BLOOM_OPEN_TIME = 2.8;
      // Durasi satu bunga dari tunas sampai mekar penuh = 0.55 * 2.4 + 2.8 = 4.12 detik
      const SINGLE_FLOWER_DURATION = STEM_GROW_TIME * 0.55 + BLOOM_OPEN_TIME;
      const MAX_START_DELAY = Math.max(0, TOTAL_SEQUENCE_SECONDS - SINGLE_FLOWER_DURATION);

      const totalFlowers = width < 600 ? 22 : 34;

      for (let i = 0; i < totalFlowers; i++) {
        // Sebar posisi horizontal merata dari kiri ke kanan
        const ratio = (i + 0.5) / totalFlowers;
        const x = ratio * width + (Math.random() - 0.5) * (width / totalFlowers) * 0.75;

        // Variasi tinggi tangkai bertingkat (lapis belakang tinggi, sisi tepi lebih tinggi, tengah lebih rendah agar lirik tetap terbaca)
        const distFromCenter = Math.abs(ratio - 0.5) * 2; // 0 di tengah, 1 di tepi
        const baseStem = width < 600 ? 85 : 115;
        const extraSideHeight = distFromCenter * (height * 0.24);
        const layerVariation = (i % 3) * (width < 600 ? 34 : 52);
        const stemHeight = Math.min(height * 0.58, baseStem + extraSideHeight + layerVariation + Math.random() * 35);

        // Penjadwalan bertahap dari 0 detik hingga 15 detik (mekar dari tengah menyebar & berlapis)
        const waveProgress = i / (totalFlowers - 1);
        const delay = waveProgress * MAX_START_DELAY;

        const type = FLOWER_TYPES[i % FLOWER_TYPES.length];
        const baseScale = width < 600 ? 0.78 : 0.94;

        addFlower({
          x,
          y: height - stemHeight,
          stemHeight,
          type,
          scale: baseScale + (i % 3) * 0.1 + Math.random() * 0.12,
          delay,
          stemDuration: STEM_GROW_TIME,
          bloomDuration: BLOOM_OPEN_TIME,
          isUserSpawned: false
        });
      }
    }

    // Langsung jalankan taman bunga 15 detik saat website dibuka
    spawnFifteenSecondGarden();

    /* =========================================================================
       5. INTERAKSI BUNGA BARU & 3 TOMBOL TAP ACAK (MUNCUL 300ms, JEDA 1 DETIK)
       ========================================================================= */
    function spawnInteractiveStemmedFlower(x, y) {
      ensureAudioPlaying();

      const randomType = FLOWER_TYPES[Math.floor(Math.random() * FLOWER_TYPES.length)];
      // Tangkai tumbuh dari bawah titik sentuh (minimal 85px hingga maksimal 230px)
      const stemH = Math.min(230, Math.max(85, height - y));

      addFlower({
        x,
        y,
        stemHeight: stemH,
        type: randomType,
        scale: (width < 600 ? 0.85 : 1.0) + Math.random() * 0.25,
        delay: 0,
        stemDuration: 1.2,
        bloomDuration: 1.5,
        isUserSpawned: true
      });

      ripples.push({
        x,
        y,
        radius: 6,
        maxRadius: 52,
        alpha: 0.85
      });
    }

    canvas.addEventListener("pointerdown", (e) => {
      spawnInteractiveStemmedFlower(e.clientX, e.clientY);
    });

    // Logika 3 Tombol Tap Acak: tampil 300ms -> sembunyi 1000ms -> ulangi
    const tapButtons = [
      document.getElementById("tapBtn0"),
      document.getElementById("tapBtn1"),
      document.getElementById("tapBtn2")
    ];

    tapButtons.forEach((btn) => {
      btn.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        const rect = btn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        btn.classList.remove("visible");
        spawnInteractiveStemmedFlower(cx, cy);
      });
    });

    function getThreeRandomPositions() {
      const marginX = Math.max(55, width * 0.12);
      const marginY = Math.max(70, height * 0.15);
      const minDistance = Math.min(130, width * 0.24);
      const positions = [];

      for (let i = 0; i < 3; i++) {
        let candidate = { x: width / 2, y: height / 2 };
        for (let attempt = 0; attempt < 25; attempt++) {
          const rx = marginX + Math.random() * Math.max(20, width - marginX * 2);
          const ry = marginY + Math.random() * Math.max(20, height - marginY * 2);
          const tooClose = positions.some((p) => Math.hypot(p.x - rx, p.y - ry) < minDistance);
          candidate = { x: rx, y: ry };
          if (!tooClose) break;
        }
        positions.push(candidate);
      }
      return positions;
    }

    function runRandomTapCycle() {
      const positions = getThreeRandomPositions();

      // Munculkan 3 tombol Tap di titik acak selama 300ms
      tapButtons.forEach((btn, idx) => {
        btn.style.left = `${positions[idx].x}px`;
        btn.style.top = `${positions[idx].y}px`;
        btn.classList.add("visible");
      });

      setTimeout(() => {
        // Sembunyikan setelah 300ms
        tapButtons.forEach((btn) => btn.classList.remove("visible"));

        // Jeda 1 detik (1000ms), lalu munculkan lagi di titik acak baru
        setTimeout(runRandomTapCycle, 1000);
      }, 300);
    }

    // Mulai siklus 3 tombol Tap acak
    setTimeout(runRandomTapCycle, 400);

    /* =========================================================================
       6. LOOP ANIMASI UTAMA 60FPS
       ========================================================================= */
    let lastTimestamp = performance.now();

    function animate(now) {
      const dt = Math.min(0.05, (now - lastTimestamp) / 1000);
      lastTimestamp = now;
      const timeSec = now / 1000;

      ctx.clearRect(0, 0, width, height);

      // 1. Partikel Cahaya Hangat
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < -10) {
          p.y = height + 10;
          p.x = Math.random() * width;
        }
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;

        const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(timeSec * 2.2 + p.phase));
        ctx.fillStyle = `rgba(${p.hue}, ${twinkle})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Kelopak Bunga Melayang
      for (let i = 0; i < petals.length; i++) {
        const pt = petals[i];
        pt.y += pt.vy;
        pt.x += Math.sin(pt.y * pt.swayFreq + pt.phase) * pt.swayAmp;
        pt.angle += pt.vAngle;

        if (pt.y > height + 25) {
          Object.assign(pt, createPetal(false));
        }

        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(pt.angle);
        ctx.scale(1, 0.6 + 0.4 * Math.sin(timeSec * 2 + pt.phase));
        ctx.globalAlpha = pt.alpha;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.moveTo(0, -pt.size);
        ctx.bezierCurveTo(pt.size, -pt.size * 0.5, pt.size * 0.8, pt.size, 0, pt.size);
        ctx.bezierCurveTo(-pt.size * 0.8, pt.size, -pt.size, -pt.size * 0.5, 0, -pt.size);
        ctx.fill();
        ctx.restore();
      }

      // 3. Riak Cahaya Interaktif
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.radius += dt * 80;
        rp.alpha -= dt * 1.15;
        if (rp.alpha <= 0) {
          ripples.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.strokeStyle = `rgba(255, 214, 228, ${rp.alpha})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 4. Semua Bunga Bertangkai Mekar
      for (let i = flowers.length - 1; i >= 0; i--) {
        const fl = flowers[i];
        fl.update(dt, timeSec);
        if (fl.alpha <= 0) {
          flowers.splice(i, 1);
          continue;
        }
        fl.draw(ctx);
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
